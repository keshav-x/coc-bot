name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller ApexClashPro.spec

      - name: Package Release (Windows)
        shell: pwsh
        run: |
          Copy-Item start_windows.bat dist/ApexClashPro/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ApexClashPro/* -DestinationPath ApexClashPro-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ApexClashPro-Windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: ApexClash Pro ${{ github.ref_name || 'v1.0.0' }} — Autonomous Farming Suite
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            # ApexClash Pro — Official Release

            High-velocity autonomous farming bot for **Clash of Clans** powered by OpenCV template matching, Tesseract OCR loot filtration, and human-like Bézier antiban movement.

            ---

            ## 📥 Download

            | Operating System | Package | Architecture | Launch Method |
            | :--- | :--- | :--- | :--- |
            | 🪟 **Windows** | `ApexClashPro-Windows-x64.zip` | 64-bit (Windows 10/11) | Run `ApexClashPro.exe` |

            > ℹ️ **macOS & Linux Users**: Google Play Games on PC is currently a Windows-exclusive application. macOS and Linux users can run ApexClash Pro through a Windows 10/11 Virtual Machine (e.g. Parallels Desktop, VMware Fusion, or KVM) with virtualization enabled. Native ADB mode for direct Android control is in development.

            ---

            ## ⚡ Features
            - **Live Session Analytics**: Real-time Total Loot, Gold/hr, Elixir/hr, Dark Elixir, and raid telemetry table.
            - **Smart Loot Filter**: Configurable minimum loot thresholds with automatic base skipping.
            - **Autonomous Combat Strategies**: Surgical Sneaky Goblin drops, Electro Dragons, Valkyries, and delayed Hero abilities.
            - **Wall Upgrader**: Smart background wall spending to prevent overflowing storages.
            - **Advanced Antiban Suite**: Randomized Gaussian tap scatter, Bézier mouse trajectories, and configurable break schedules.
            - **Discord Webhooks**: Live raid completion embeds, loot snapshots, and notification alerts.
            - **2-Hour Free Trial**: Automatic offline trial included on first launch.

            ---

            ## 🔑 Access Passes & In-App Activation
            
            ApexClash Pro includes an automatic **2-Hour Free Trial** on first launch.

            | Pass Tier | Price | Duration | Features |
            | :--- | :--- | :--- | :--- |
            | **Weekly Pass** | **₹99 / $1.99** | 7 Days | Full Access, Autonomous Farming, Smart Loot Filter |
            | **Monthly Pass** | **₹249 / $4.99** | 30 Days | Full Access, Autonomous Farming, Smart Loot Filter |
            | **Annual Pass** | **₹799 / $14.99** | 365 Days | Full Access, All Updates, Priority Support |
            | **Lifetime VIP Pass** | **₹1,299 / $24.99** | Lifetime | Permanent VIP Access, All Future Updates, Priority Support |

            ### 🛒 Instant In-App Activation (New in v1.3.2)
            1. Launch ApexClash Pro and click **Buy Subscription** or **Buy Lifetime**.
            2. Scan the PhonePe QR code (`cockingkeshav@ybl`) or click **Pay via PayPal** (`paypal.me/cockingkeshav`).
            3. Paste your **12-digit UTR** or **PayPal Transaction ID** into the Instant Activation field.
            4. Click **⚡ Unlock Pro Now** — the bot binds to your machine and unlocks Pro immediately!
            5. *Official Web Store & Help*: https://keshav-x.github.io/coc-bot/
