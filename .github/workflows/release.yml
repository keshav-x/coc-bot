name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ApexClashPro-Windows-x64.zip
            platform: windows
          - os: ubuntu-latest
            artifact_name: ApexClashPro-Linux-x64.tar.gz
            platform: linux
          - os: macos-latest
            artifact_name: ApexClashPro-macOS-x64.zip
            platform: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller ApexClashPro.spec

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item start_windows.bat dist/ApexClashPro/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ApexClashPro/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Release (Linux)
        if: runner.os == 'Linux'
        run: |
          cp install_linux.sh start_linux.sh dist/ApexClashPro/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact_name }} -C dist ApexClashPro

      - name: Package Release (macOS)
        if: runner.os == 'macOS'
        run: |
          cp start_mac.command install_mac.command dist/ApexClashPro/ 2>/dev/null || true
          cd dist && zip -r ../${{ matrix.artifact_name }} ApexClashPro

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact_name }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package Linux & Raspberry Pi Universal 1-Click Release
        run: |
          mkdir -p rpi-pkg/ApexClashPro
          cp -r app assets templates tessdata main.py requirements.txt README.md install_linux.sh start_linux.sh start_mac.command install_mac.command start_windows.bat rpi-pkg/ApexClashPro/
          chmod +x rpi-pkg/ApexClashPro/*.sh rpi-pkg/ApexClashPro/*.command
          tar -czf release-assets/ApexClashPro-Linux-RaspberryPi-Universal.tar.gz -C rpi-pkg ApexClashPro
          cd rpi-pkg && zip -r ../release-assets/ApexClashPro-macOS-Universal.zip ApexClashPro

      - name: List Artifacts
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: ApexClash Pro ${{ github.ref_name || 'v1.0.0' }} — Autonomous Farming Suite
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            # ApexClash Pro — Official Multi-Platform Release

            High-velocity autonomous farming bot for **Clash of Clans** powered by OpenCV template matching, Tesseract OCR loot filtration, and human-like Bézier antiban movement.

            ---

            ## 📥 Downloads & 1-Click Launchers

            | Operating System | Package | Architecture | Launch Method |
            | :--- | :--- | :--- | :--- |
            | 🪟 **Windows** | `ApexClashPro-Windows-x64.zip` | 64-bit (Windows 10/11) | Run `ApexClashPro.exe` |
            | 🐧 **Linux** | `ApexClashPro-Linux-x64.tar.gz` | x86_64 | Run `./start_linux.sh` |
            | 🍓 **Raspberry Pi & Linux** | `ApexClashPro-Linux-RaspberryPi-Universal.tar.gz` | ARM64 / aarch64 / armv7l / all Linux | Run `./install_linux.sh` |
            | 🍎 **macOS** | `ApexClashPro-macOS-Universal.zip` | Apple Silicon / Intel | Double-click `start_mac.command` |

            ---

            ## ⚡ Features
            - **Live Session Analytics**: Real-time Total Loot, Gold/hr, Elixir/hr, Dark Elixir, and raid telemetry table.
            - **Smart Loot Filter**: Configurable minimum loot thresholds with automatic base skipping.
            - **Autonomous Combat Strategies**: Surgical Sneaky Goblin drops, Electro Dragons, Valkyries, and delayed Hero abilities.
            - **Wall Upgrader**: Smart background wall spending to prevent overflowing storages.
            - **Advanced Antiban Suite**: Randomized Gaussian tap scatter, Bézier mouse trajectories, and configurable break schedules.
            - **Discord Webhooks**: Live raid completion embeds, loot snapshots, and notification alerts.
            - **2-Hour Free Trial**: Automatic offline trial included on first launch.

